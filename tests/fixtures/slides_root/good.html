<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture deck</title>
<style>
:root { --main:#1f5fa8; --pub:#1f5fa8; --sec:#b5530b; --ink:#1d2330; --muted:#5b6475; --bg:#f6f7f9; --card:#fff; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; }
#progress-track { position:fixed; top:0; left:0; right:0; height:4px; background:#dde2ea; z-index:10; }
#progress { height:100%; width:0; background:var(--main); }
.deck { position:fixed; left:50%; top:50%; width:1280px; height:720px; transform-origin:center; }
section.slide { position:absolute; inset:0; padding:56px 72px 64px; background:var(--card); display:none; overflow:hidden; }
section.slide.active { display:block; }
h1 { font-size:44px; margin:0 0 24px; } h2 { font-size:34px; margin:0 0 20px; }
li, p { font-size:24px; line-height:1.5; }
footer.src { position:absolute; left:72px; bottom:20px; font-size:15px; color:var(--muted); }
footer.src a { color:var(--main); }
aside.notes { display:none; }
body.show-notes section.slide.active aside.notes { display:block; position:absolute; right:16px; bottom:56px; width:420px;
  background:#fffbe6; border:1px solid #e6d27a; padding:10px 14px; font-size:15px; }
nav.ctrl { position:fixed; right:16px; bottom:12px; display:flex; gap:8px; align-items:center; z-index:10; }
nav.ctrl button { font-size:16px; padding:4px 12px; }
#counter { font-size:15px; color:var(--muted); min-width:56px; text-align:center; }
.quiz-q { margin-bottom:14px; } .quiz-q p { margin:0 0 6px; font-size:20px; }
button.opt { font-size:17px; margin-right:8px; padding:4px 10px; }
.feedback { font-size:17px; margin-top:6px; } .feedback.correct { color:#1b7a3a; } .feedback.wrong { color:#a3281a; }
@media (max-width:700px) {
  html, body { height:auto; }
  .deck { position:static; width:auto; height:auto; transform:none !important; }
  section.slide { position:relative; display:block; margin:0 0 12px; padding:24px 16px 48px; min-height:auto; }
  h1 { font-size:28px; } h2 { font-size:22px; } li, p { font-size:17px; }
  footer.src { left:16px; bottom:12px; font-size:13px; }
  nav.ctrl, #progress-track { display:none; }
}
@media print {
  nav.ctrl, #progress-track { display:none; }
  .deck { position:static; transform:none !important; }
  section.slide { position:relative; display:block; page-break-after:always; }
}
</style>
</head>
<body>
<div id="progress-track"><div id="progress"></div></div>
<main class="deck">
  <section class="slide" data-slide="01" data-type="cover" data-wiki="concepts/kem.md">
    <h1>封面</h1>
    <footer class="src nonfact">Wiki：<a href="#">KEM →</a></footer>
    <aside class="notes">講者備註 1</aside>
  </section>
  <section class="slide" data-slide="02" data-type="concept" data-wiki="concepts/kem.md">
    <h2>HQC-1 公鑰 2,241 位元組</h2>
    <ul><li>規格 2025-08-22 版</li></ul>
    <footer class="src nonfact">Wiki：<a href="#">KEM →</a></footer>
    <aside class="notes">講者備註 2</aside>
  </section>
  <section class="slide" data-slide="03" data-type="concept" data-wiki="concepts/kem.md">
    <h2>失敗率低於 2<sup>−128</sup></h2>
    <footer class="src nonfact">Wiki：<a href="#">KEM →</a></footer>
    <aside class="notes">講者備註 3</aside>
  </section>
  <section class="slide" data-slide="04" data-type="quiz" data-wiki="concepts/kem.md">
    <h2>小測驗</h2>
    <div class="quiz-q"><p>第一題</p>
      <button class="opt" data-correct="true">A</button><button class="opt" data-correct="false">B</button>
      <div class="feedback" hidden><span class="verdict"></span> 解釋一</div></div>
    <div class="quiz-q"><p>第二題</p>
      <button class="opt" data-correct="false">A</button><button class="opt" data-correct="true">B</button>
      <div class="feedback" hidden><span class="verdict"></span> 解釋二</div></div>
    <footer class="src nonfact">Wiki：<a href="#">KEM →</a></footer>
    <aside class="notes">講者備註 4</aside>
  </section>
</main>
<nav class="ctrl nonfact"><button id="prev" aria-label="上一頁">←</button><span id="counter"></span><button id="next" aria-label="下一頁">→</button></nav>
<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll('section.slide'));
  var N = slides.length, cur = 0;
  var counter = document.getElementById('counter'), bar = document.getElementById('progress');
  var deck = document.querySelector('.deck');
  function fit() {
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    deck.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  function show(i) {
    cur = Math.max(0, Math.min(N - 1, i));
    slides.forEach(function (s, k) { s.classList.toggle('active', k === cur); });
    counter.textContent = (cur + 1) + ' / ' + N;
    bar.style.width = ((cur + 1) / N * 100) + '%';
    if (location.hash !== '#' + (cur + 1)) history.replaceState(null, '', '#' + (cur + 1));
  }
  function fromHash() { var n = parseInt(location.hash.slice(1), 10); show(isNaN(n) ? 0 : n - 1); }
  window.addEventListener('hashchange', fromHash);
  window.addEventListener('resize', fit);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); show(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(cur - 1); }
    else if (e.key === 'n' || e.key === 'N') { document.body.classList.toggle('show-notes'); }
  });
  document.getElementById('next').addEventListener('click', function () { show(cur + 1); this.blur(); });
  document.getElementById('prev').addEventListener('click', function () { show(cur - 1); this.blur(); });
  document.querySelectorAll('.quiz-q').forEach(function (q) {
    q.querySelectorAll('button.opt').forEach(function (b) {
      b.addEventListener('click', function () {
        var ok = b.dataset.correct === 'true', fb = q.querySelector('.feedback');
        fb.hidden = false;
        fb.className = 'feedback ' + (ok ? 'correct' : 'wrong');
        fb.querySelector('.verdict').textContent = ok ? '答對了！' : '答錯了。';
        b.blur();
      });
    });
  });
  fit(); fromHash();
})();
</script>
</body>
</html>
