# B1 查詢 wiki 的問題清單（SPEC §9.2）。run-001 與 run-002 使用同一份。
goals:
  G1: 說出為什麼量子電腦會威脅現在的公鑰密碼，以及為什麼「現在」就要準備。
  G2: 用自己的話解釋金鑰封裝機制（KEM）在做什麼。
  G3: 說明錯誤更正碼、漢明重量的意思，以及「故意加錯誤」為什麼能拿來加密。
  G4: 依序描述 HQC 的金鑰產生、加密、解密三步，並指出哪個值是公開的、哪個是秘密的。
  G5: 比較 HQC 與 ML-KEM 的數學基礎與大小差異，說出 NIST 選 HQC 當備援的理由。
